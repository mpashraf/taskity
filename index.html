  <!-- Dynamic PWA Manifest & App Icon -->
  <script>
    (function setupPWA() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="120" fill="url(#g)"/>
        <path d="M150 265 L220 335 L365 180" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(iconSvg);

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon);

      const manifest = {
        name: 'Taskity · Team Daily Flow',
        short_name: 'Taskity',
        description: 'Day-based employee task creation & live progress tracker',
        start_url: './',
        display: 'standalone',
        background_color: '#0f172a',
        theme_color: '#4f46e5',
        orientation: 'portrait',
        icons: [
          { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
          { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
        ]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(manifestLink);
    })();
  </script>

    function getInitials(name) {
      if (!name) return '?';
      return name
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part[0].toUpperCase())
        .join('');
    }

    function getEmployeeGradient(name) {
      if (EMPLOYEE_THEMES[name]) return EMPLOYEE_THEMES[name].bg;
      const fallbacks = [
        'from-indigo-500 to-blue-500',
        'from-emerald-500 to-teal-500',
        'from-fuchsia-500 to-pink-500',
        'from-amber-500 to-orange-500',
        'from-cyan-500 to-sky-500'
      ];
      let hash = 0;
      for (let i = 0; i < (name || '').length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return fallbacks[Math.abs(hash) % fallbacks.length];
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function parseLocalDate(isoStr) {
      const [y, m, d] = isoStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function getRelativeDayLabel(isoStr) {
      const target = parseLocalDate(isoStr);
      const today = parseLocalDate(todayISO);
      const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return 'Today';
      if (diffDays === 1) return 'Tomorrow';
      if (diffDays === -1) return 'Yesterday';
      return target.toLocaleDateString('en-US', { weekday: 'long' });
    }

    function formatHumanDate(isoStr) {
      const d = parseLocalDate(isoStr);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    let toastTimer = null;
    function showToast(msg, icon = '✅') {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      document.getElementById('toastIcon').textContent = icon;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }

    function setSyncStatus(mode, customText = null) {
      if (mode === 'live') {
        syncDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
        syncLabel.textContent = customText || 'Firestore Live Sync';
      } else if (mode === 'local') {
        syncDot.className = 'w-2 h-2 rounded-full bg-amber-400';
        syncLabel.textContent = customText || 'Local Mode (Check Rules)';
      } else {
        syncDot.className = 'w-2 h-2 rounded-full bg-indigo-400 animate-pulse';
        syncLabel.textContent = customText || 'Syncing...';
      }
    }

    // =========================================================================
    // 6. LOCAL STORAGE FALLBACK (ONLY USED IF FIRESTORE RULES BLOCK WRITES)
    // =========================================================================
    function loadLocalFallbackTasks() {
      const saved = localStorage.getItem('taskity_fallback_tasks');
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {}
      }
      return [];
    }

    function saveLocalFallbackTasks(tasks) {
      localStorage.setItem('taskity_fallback_tasks', JSON.stringify(tasks));
    }

    // =========================================================================
    // 7. FIREBASE INITIALIZATION & REALTIME LISTENER
    // =========================================================================
    function initFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        tasksCollection = collection(db, 'tasks');

        const q = query(tasksCollection, orderBy('createdAt', 'desc'));
        onSnapshot(
          q,
          (snapshot) => {
            state.useLocalFallback = false;
            state.isLoading = false;
            state.tasks = snapshot.docs.map(docSnap => ({
              id: docSnap.id,
              ...docSnap.data()
            }));
            setSyncStatus('live');
            renderAll();
          },
          (error) => {
            console.error('Firestore listener error:', error.code, error.message);
            state.useLocalFallback = true;
            state.isLoading = false;
            state.tasks = loadLocalFallbackTasks();
            const reason = error.code === 'permission-denied'
              ? 'Firestore Rules Blocked'
              : 'Offline / Local Mode';
            setSyncStatus('local', reason);
            renderAll();
          }
        );
      } catch (err) {
        console.error('Firebase init failed:', err);
        state.useLocalFallback = true;
        state.isLoading = false;
        state.tasks = loadLocalFallbackTasks();
        setSyncStatus('local', 'Local Mode');
        renderAll();
      }
    }

    // =========================================================================
    // 8. CRUD OPERATIONS (CREATE, UPDATE PROGRESS, DELETE)
    // =========================================================================
    async function createTask({ title, assignee, date, priority, notes }) {
      const newTask = {
        title: title.trim(),
        assignee: assignee,
        date,
        priority: priority || 'normal',
        notes: notes.trim(),
        progress: 0,
        createdBy: state.currentUser || assignee,
        createdAt: Date.now()
      };

      if (!state.useLocalFallback && tasksCollection) {
        try {
          await addDoc(tasksCollection, newTask);
          showToast(`Assigned to ${assignee}`, '🚀');
          return;
        } catch (err) {
          console.error('Firestore write blocked:', err.code, err.message);
          state.useLocalFallback = true;
          setSyncStatus('local', 'Firestore Rules Blocked');
          showToast('Firestore rules blocked write — saved locally', '⚠️');
        }
      }

      newTask.id = 'local-' + Date.now();
      state.tasks.unshift(newTask);
      saveLocalFallbackTasks(state.tasks);
      renderAll();
      showToast(`Saved locally for ${assignee}`, '💾');
    }

    async function updateTaskProgress(taskId, newProgress) {
      const clamped = Math.max(0, Math.min(100, Number(newProgress)));

      const targetTask = state.tasks.find(t => t.id === taskId);
      const prevProgress = targetTask ? targetTask.progress : 0;
      if (targetTask) {
        targetTask.progress = clamped;
        renderAll();
      }

      if (clamped === 100 && prevProgress < 100 && typeof confetti === 'function') {
        confetti({
          particleCount: 55,
          spread: 65,
          origin: { y: 0.72 }
        });
        showToast('Task 100% completed! Great work!', '🎉');
      }

      if (!state.useLocalFallback && db && !String(taskId).startsWith('local-')) {
        try {
          const ref = doc(db, 'tasks', taskId);
          await updateDoc(ref, { progress: clamped });
          return;
        } catch (err) {
          console.warn('Firestore update failed, syncing locally:', err);
          state.useLocalFallback = true;
          setSyncStatus('local', 'Firestore Rules Blocked');
        }
      }

      saveLocalFallbackTasks(state.tasks);
    }

    async function deleteTask(taskId) {
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      renderAll();

      if (!state.useLocalFallback && db && !String(taskId).startsWith('local-')) {
        try {
          await deleteDoc(doc(db, 'tasks', taskId));
          showToast('Task removed', '🗑️');
          return;
        } catch (err) {
          console.warn('Firestore delete failed:', err);
        }
      }
      saveLocalFallbackTasks(state.tasks);
      showToast('Task removed', '🗑️');
    }

      assigneePickerGrid.querySelectorAll('[data-pick-emp]').forEach(btn => {

    function renderDayStrip() {
      const base = parseLocalDate(todayISO);
      const days = [];
      for (let offset = -1; offset <= 10; offset++) {
        const d = new Date(base);
        d.setDate(base.getDate() + offset);
        days.push(formatDateISO(d));
      }
      if (!days.includes(state.selectedDate)) {
        days.unshift(state.selectedDate);
      }

      dayStrip.innerHTML = days.map(iso => {
        const d = parseLocalDate(iso);
        const isSelected = iso === state.selectedDate;
        const isToday = iso === todayISO;
        const dayShort = isToday
          ? 'TODAY'
          : iso === formatDateISO(new Date(base.getFullYear(), base.getMonth(), base.getDate() + 1))
          ? 'TMRW'
          : d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
        const dayNum = d.getDate();

        const dayTasks = state.tasks.filter(t => t.date === iso);
        const hasTasks = dayTasks.length > 0;
        const allDone = hasTasks && dayTasks.every(t => Number(t.progress) === 100);

        return `
          <button data-date="${iso}" class="day-pill shrink-0 w-14 py-2.5 rounded-2xl flex flex-col items-center justify-center transition-all ${
            isSelected
              ? 'bg-white text-slate-950 shadow-lg scale-105 font-bold'
              : 'bg-white/10 text-slate-200 hover:bg-white/20'
          }">
            <span class="text-[10px] tracking-wider font-bold ${isSelected ? 'text-indigo-600' : 'text-slate-300'}">${dayShort}</span>
            <span class="font-display text-lg font-extrabold leading-tight my-0.5">${dayNum}</span>
            <span class="w-1.5 h-1.5 rounded-full ${
              allDone ? 'bg-emerald-400' : hasTasks ? (isSelected ? 'bg-indigo-600' : 'bg-cyan-400') : 'bg-transparent'
            }"></span>
          </button>
        `;
      }).join('');

      dayStrip.querySelectorAll('.day-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedDate = btn.dataset.date;
          nativeDatePicker.value = state.selectedDate;
          renderAll();
        });
      });
    }

    function renderPulseHeader() {
      const rel = getRelativeDayLabel(state.selectedDate);
      selectedDaySubtitle.textContent = `${rel}'s Team Pulse`;
      selectedDateHeading.textContent = formatHumanDate(state.selectedDate);

      const dayTasks = state.tasks.filter(t => t.date === state.selectedDate);
      const total = dayTasks.length;
      const completedCount = dayTasks.filter(t => Number(t.progress) === 100).length;
      const avgProgress = total === 0
        ? 0
        : Math.round(dayTasks.reduce((sum, t) => sum + Number(t.progress || 0), 0) / total);

      dayCompletionPct.textContent = `${avgProgress}%`;
      dayTaskFraction.textContent = `${completedCount} of ${total} done`;
      dayMasterBar.style.width = `${avgProgress}%`;
    }

    function getPriorityBadge(priority) {
      if (priority === 'high') {
        return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-rose-50 text-rose-600 border border-rose-200/70">🔥 High</span>`;
      }
      if (priority === 'low') {
        return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-600 border border-emerald-200/70">✨ Quick Win</span>`;
      }
      return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600 border border-indigo-200/70">⚡ Normal</span>`;
    }

    function getProgressMeta(progress) {
      const p = Number(progress);
      if (p === 100) return { label: 'Completed', color: '#10b981', textClass: 'text-emerald-600', badgeBg: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
      if (p > 0) return { label: 'In Progress', color: '#4f46e5', textClass: 'text-indigo-600', badgeBg: 'bg-indigo-50 text-indigo-700 border-indigo-200' };
      return { label: 'Not Started', color: '#94a3b8', textClass: 'text-slate-500', badgeBg: 'bg-slate-100 text-slate-600 border-slate-200' };
    }

    function renderTasks() {
      if (state.isLoading) return;

      let filtered = state.tasks.filter(t => t.date === state.selectedDate);

      if (state.filter === 'mine') {
        const me = state.currentUser.toLowerCase();
        filtered = filtered.filter(t => (t.assignee || '').toLowerCase() === me);
      } else if (state.filter === 'active') {
        filtered = filtered.filter(t => Number(t.progress) > 0 && Number(t.progress) < 100);
      } else if (state.filter === 'done') {
        filtered = filtered.filter(t => Number(t.progress) === 100);
      } else if (state.filter.startsWith('emp:')) {
        const targetEmp = state.filter.slice(4);
        filtered = filtered.filter(t => t.assignee === targetEmp);
      }

      if (filtered.length === 0) {
        const emptyLabel = state.filter.startsWith('emp:')
          ? `No tasks assigned to ${escapeHTML(state.filter.slice(4))} on this day`
          : state.filter === 'mine' && state.currentUser
          ? `No tasks assigned to ${escapeHTML(state.currentUser)} on this day`
          : `No tasks scheduled for this day`;

        taskListContainer.innerHTML = `
          <div class="bg-white rounded-3xl p-8 text-center border border-slate-200/80 shadow-xs mt-2 card-enter">
            <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-3 text-2xl">
              📋
            </div>
            <h3 class="font-display font-bold text-slate-900 text-base">${emptyLabel}</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-[260px] mx-auto">
              Tap <strong>+ New Task</strong> below to assign a daily task to Rahoof, Fidha Nasreen, Suhail, Ashraf, or Anwar.
            </p>
            <button type="button" id="emptyStateCreateBtn" class="mt-4 inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-sm hover:bg-indigo-700 transition">
              + Assign Task
            </button>
          </div>
        `;
        const emptyBtn = document.getElementById('emptyStateCreateBtn');
        if (emptyBtn) {
          emptyBtn.onclick = () => document.getElementById('openCreateModalBtn').click();
        }
        return;
      }

      taskListContainer.innerHTML = filtered.map(task => {
        const p = Number(task.progress || 0);
        const meta = getProgressMeta(p);
        const grad = getEmployeeGradient(task.assignee);
        const isDone = p === 100;
        const assignedByText = task.createdBy && task.createdBy !== task.assignee
          ? `Assigned by ${escapeHTML(task.createdBy)}`
          : 'Daily deliverable';

        return `
          <article data-task-id="${task.id}" class="bg-white rounded-2xl p-4 border ${isDone ? 'border-emerald-200/90 bg-emerald-50/20' : 'border-slate-200/80'} shadow-xs transition-all card-enter">
            <!-- Top Row: Assignee + Priority + Delete -->
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr ${grad} text-white font-display font-bold text-xs flex items-center justify-center shrink-0 shadow-xs">
                  ${getInitials(task.assignee)}
                </div>
                <div class="min-w-0">
                  <p class="text-xs font-bold text-slate-900 truncate">${escapeHTML(task.assignee)}</p>
                  <p class="text-[10px] text-slate-400 font-medium">${assignedByText}</p>
                </div>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                ${getPriorityBadge(task.priority)}
                <button data-delete-id="${task.id}" title="Delete Task" class="delete-btn w-7 h-7 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 flex items-center justify-center transition">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Task Title & Optional Notes -->
            <h3 class="font-display font-bold text-[15px] leading-snug ${isDone ? 'line-through text-slate-400' : 'text-slate-900'}">
              ${escapeHTML(task.title)}
            </h3>
            ${task.notes ? `<p class="text-xs text-slate-500 mt-1 leading-relaxed">${escapeHTML(task.notes)}</p>` : ''}

            <!-- Interactive Progress Bar + Slider -->
            <div class="mt-4 pt-3 border-t border-slate-100">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-[11px] font-semibold text-slate-500">Progress</span>
                <div class="flex items-center gap-1.5">
                  <span class="progress-status-pill text-[10px] font-bold px-2 py-0.5 rounded-full border ${meta.badgeBg}">
                    ${meta.label} · <span class="progress-pct-text">${p}%</span>
                  </span>
                </div>
              </div>

              <input
                type="range"
                min="0"
                max="100"
                step="5"
                value="${p}"
                data-slider-id="${task.id}"
                class="progress-slider"
                style="background: linear-gradient(to right, ${meta.color} ${p}%, #e2e8f0 ${p}%);"
              />

              <!-- Quick Tap Status Pills -->
              <div class="grid grid-cols-3 gap-1.5 mt-2.5">
                <button data-quick-id="${task.id}" data-val="0" class="quick-btn py-1.5 rounded-lg text-[11px] font-semibold border transition ${
                  p === 0 ? 'bg-slate-800 text-white border-slate-800' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                }">
                  To Do
                </button>
                <button data-quick-id="${task.id}" data-val="50" class="quick-btn py-1.5 rounded-lg text-[11px] font-semibold border transition ${
                  p > 0 && p < 100 ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                }">
                  In Progress
                </button>
                <button data-quick-id="${task.id}" data-val="100" class="quick-btn py-1.5 rounded-lg text-[11px] font-semibold border transition ${
                  p === 100 ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                }">
                  Done ✓
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');

      attachCardListeners();
    }

    function attachCardListeners() {
      document.querySelectorAll('.progress-slider').forEach(slider => {
        slider.addEventListener('input', (e) => {
          const val = Number(e.target.value);
          const meta = getProgressMeta(val);
          e.target.style.background = `linear-gradient(to right, ${meta.color} ${val}%, #e2e8f0 ${val}%)`;
          const card = e.target.closest('article');
          const pctSpan = card.querySelector('.progress-pct-text');
          if (pctSpan) pctSpan.textContent = `${val}%`;
        });

        slider.addEventListener('change', (e) => {
          updateTaskProgress(e.target.dataset.sliderId, e.target.value);
        });
      });

      document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          updateTaskProgress(btn.dataset.quickId, btn.dataset.val);
        });
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          deleteTask(btn.dataset.deleteId);
        });
      });
    }

    function renderAll() {
      updateUserBadge();
      renderEmployeeRosterUI();
      renderDayStrip();
      renderPulseHeader();
      renderTasks();
    }

    // =========================================================================
    // 10. EVENT LISTENERS (MODALS, FORMS, FILTERS, PWA INSTALL)
    // =========================================================================
    function openModal(modalEl) {
      modalEl.classList.remove('hidden');
      modalEl.classList.add('flex');
    }

    function closeModal(modalEl) {
      modalEl.classList.add('hidden');
      modalEl.classList.remove('flex');
    }

    document.getElementById('openCreateModalBtn').addEventListener('click', () => {
      document.getElementById('taskDateInput').value = state.selectedDate;
      if (state.currentUser) {
        state.selectedAssigneeForNewTask = state.currentUser;
      }
      renderEmployeeRosterUI();
      openModal(createTaskModal);
      setTimeout(() => document.getElementById('taskTitleInput').focus(), 150);
    });

    document.getElementById('closeCreateModalBtn').addEventListener('click', () => closeModal(createTaskModal));
    createTaskModal.addEventListener('click', (e) => {
      if (e.target === createTaskModal) closeModal(createTaskModal);
    });

    document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('taskTitleInput').value;
      const assignee = state.selectedAssigneeForNewTask || EMPLOYEES[0];
      const date = document.getElementById('taskDateInput').value;
      const priority = document.getElementById('taskPriorityInput').value;
      const notes = document.getElementById('taskNotesInput').value;

      if (!title.trim() || !assignee) return;

      const btn = document.getElementById('submitTaskBtn');
      btn.disabled = true;
      btn.textContent = 'Assigning...';

      await createTask({ title, assignee, date, priority, notes });

      btn.disabled = false;
      btn.textContent = 'Create & Assign Task';
      e.target.reset();
      state.selectedDate = date;
      closeModal(createTaskModal);
      renderAll();
    });

    // Employee Check-In Modal
    document.getElementById('profileBtn').addEventListener('click', () => {
      renderEmployeeRosterUI();
      openModal(profileModal);
    });

    document.getElementById('closeProfileModalBtn').addEventListener('click', () => closeModal(profileModal));
    profileModal.addEventListener('click', (e) => {
      if (e.target === profileModal) closeModal(profileModal);
    });

    // Native Date Jump
    nativeDatePicker.value = state.selectedDate;
    nativeDatePicker.addEventListener('change', (e) => {
      if (e.target.value) {
        state.selectedDate = e.target.value;
        renderAll();
      }
    });

    // PWA Install Prompt Capture
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.add('hidden');
      }
      deferredPrompt = null;
    });

    // Inline Service Worker Registration for Offline Shell Caching
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      const swCode = `
        const CACHE_NAME = 'taskity-v1';
        self.addEventListener('install', (e) => {
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener('fetch', (e) => {
          if (e.request.method !== 'GET') return;
          e.respondWith(
            fetch(e.request).catch(() => caches.match(e.request))
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }

    // Boot Application
    renderAll();
    initFirebase();

    // Prompt employee check-in on first visit
    if (!state.currentUser) {
      setTimeout(() => openModal(profileModal), 500);
    }
  </script>
</body>
</html>
